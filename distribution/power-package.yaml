apiVersion: dw.superapps/v1
kind: PowerDistribution
metadata:
  id: ua
  name: Understand Anything
  description: Semantic codebase analysis, companion graph skills, dashboard visualization, and verified runtime dependencies.
spec:
  source:
    repository: nhatnguyenquang1838-coder/Understand-Anything
    defaultRef: main
  capabilities:
    dashboard: true
    companionSkills: true
  package:
    entrypoints:
      - understand-anything-plugin/skills/understand/SKILL.md
      - understand-anything-plugin/skills/understand-chat/SKILL.md
      - understand-anything-plugin/skills/understand-explain/SKILL.md
      - understand-anything-plugin/skills/understand-diff/SKILL.md
      - understand-anything-plugin/skills/understand-dashboard/SKILL.md
      - understand-anything-plugin/skills/understand-domain/SKILL.md
      - understand-anything-plugin/skills/understand-onboard/SKILL.md
      - understand-anything-plugin/skills/understand-knowledge/SKILL.md
      - understand-anything-plugin/skills/understand-figma/SKILL.md
      - scripts/power_help.py
    managedPaths:
      - LICENSE
      - SOURCE.lock.json
      - understand-anything-plugin/package.json
      - understand-anything-plugin/pnpm-workspace.yaml
      - understand-anything-plugin/pnpm-lock.yaml
      - understand-anything-plugin/agents
      - understand-anything-plugin/skills/understand
      - understand-anything-plugin/skills/understand-chat
      - understand-anything-plugin/skills/understand-explain
      - understand-anything-plugin/skills/understand-diff
      - understand-anything-plugin/skills/understand-dashboard
      - understand-anything-plugin/skills/understand-domain
      - understand-anything-plugin/skills/understand-onboard
      - understand-anything-plugin/skills/understand-knowledge
      - understand-anything-plugin/skills/understand-figma
      - understand-anything-plugin/packages/core
      - understand-anything-plugin/packages/dashboard
      - understand-anything-plugin/packages/tree-sitter-dart-wasm
      - understand-anything-plugin/packages/tree-sitter-swift-wasm
      - scripts/power_help.py
    runtimeTemplates: true
  include:
    - LICENSE
    - SOURCE.lock.json
    - understand-anything-plugin/package.json
    - understand-anything-plugin/pnpm-workspace.yaml
    - understand-anything-plugin/pnpm-lock.yaml
    - understand-anything-plugin/tsconfig.json
    - understand-anything-plugin/agents/**
    - understand-anything-plugin/skills/understand/**
    - understand-anything-plugin/skills/understand-chat/**
    - understand-anything-plugin/skills/understand-explain/**
    - understand-anything-plugin/skills/understand-diff/**
    - understand-anything-plugin/skills/understand-dashboard/**
    - understand-anything-plugin/skills/understand-domain/**
    - understand-anything-plugin/skills/understand-onboard/**
    - understand-anything-plugin/skills/understand-knowledge/**
    - understand-anything-plugin/skills/understand-figma/**
    - understand-anything-plugin/packages/core/**
    - understand-anything-plugin/packages/dashboard/**
    - understand-anything-plugin/packages/tree-sitter-dart-wasm/**
    - understand-anything-plugin/packages/tree-sitter-swift-wasm/**
    - scripts/power_help.py
  exclude:
    - "**/node_modules/**"
    - "**/dist/**"
    - "**/coverage/**"
    - "**/.cache/**"
    - "**/__pycache__/**"
    - "**/*.pyc"
    - "**/*.log"
    - understand-anything-plugin/packages/core/test/**
    - understand-anything-plugin/packages/core/tests/**
    - understand-anything-plugin/packages/dashboard/test/**
    - understand-anything-plugin/packages/dashboard/tests/**
  forbidden:
    paths:
      - ".github/**"
      - ".ua/**"
      - ".understand-anything/**"
      - "apps/**"
      - "docs/superpowers/**"
      - "tests/**"
      - "understand-anything-plugin/packages/vscode-extension/**"
      - "understand-anything-plugin/apps/**"
      - "**/screenshots/**"
      - "**/marketing/**"
      - "**/examples/generated/**"
    contentPatterns:
      - "(?i)BEGIN [A-Z ]*PRIVATE KEY"
      - "(?i)(api[_-]?key|token|secret)\\s*[:=]\\s*['\"][^'\"]{12,}['\"]"
  runtime:
    dataRoot: .ua
    configRequired: false
