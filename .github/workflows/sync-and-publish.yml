name: Check upstream and publish UA Power

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      package_version:
        description: Optional immutable package version override.
        required: false
        default: ""
        type: string
      publish:
        description: Publish release and synchronize power-dist after validation.
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Verify source lock and detect drift
        shell: bash
        env:
          ALLOW_CONTROLLED_DRIFT: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        run: |
          set -euo pipefail
          args=(--json)
          if [[ "$ALLOW_CONTROLLED_DRIFT" == "true" ]]; then
            args+=(--allow-controlled-drift)
          fi
          python scripts/check-upstream.py "${args[@]}"

  publish:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: drift
    uses: nhatnguyenquang1838-coder/DW-SuperApps/.github/workflows/reusable-publish-power.yml@299cd605899467377cd31651b27d31c3f88db759
    with:
      power_id: ua
      recipe_path: distribution/power-package.yaml
      package_version: ${{ github.event.inputs.package_version || format('ua-main-{0}-{1}', github.run_number, github.sha) }}
      foundation_ref: 299cd605899467377cd31651b27d31c3f88db759
      source_date_epoch: 0
      distribution_branch: power-dist
      publish_release: true
      publish_distribution_branch: true
    secrets: inherit
