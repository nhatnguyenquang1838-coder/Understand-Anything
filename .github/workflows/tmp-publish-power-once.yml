name: Publish UA Power once
# publication-trigger: 1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-publish-power-once.yml

permissions:
  contents: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Verify source lock and detect drift
        run: python scripts/check-upstream.py --json

  publish:
    needs: drift
    uses: nhatnguyenquang1838-coder/DW-SuperApps/.github/workflows/reusable-publish-power.yml@ef50325f73a0a1f11a6b1d4055062768ae251131
    with:
      power_id: ua
      recipe_path: distribution/power-package.yaml
      package_version: main-20260725.1-c0e4821
      foundation_ref: ef50325f73a0a1f11a6b1d4055062768ae251131
      source_date_epoch: 0
      distribution_branch: power-dist
      publish_release: true
      publish_distribution_branch: true
    secrets: inherit

  cleanup:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
      - name: Remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-publish-power-once.yml
          git commit -m "chore(power): remove one-time UA publication workflow"
          git push origin HEAD:main
